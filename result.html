<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blood Group Prediction Result</title>
    <link href="https://fonts.googleapis.com/css?family=DM+Sans:400,500,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            height: 100vh;
            margin: 0;
            font-family: 'DM Sans', sans-serif;
            background: linear-gradient(135deg, #ff6a6a, #ffbd69); /* Vibrant gradient */
            overflow: hidden;
        }

        .loading {
            display: none;
            width: 100px;
            height: 100px;
            border: 16px solid #f3f3f3; /* Light grey */
            border-top: 16px solid #3498db; /* Blue */
            border-radius: 50%;
            animation: spin 2s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .result-container {
            display: none; /* Hide until loading is complete */
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            text-align: center;
            width: 360px;
            transition: transform 0.3s ease-in-out, opacity 0.5s;
            opacity: 0; /* Start as transparent */
            transform: translateY(-20px); /* Start slightly above */
            animation: bounceIn 0.5s forwards; /* Bounce in effect */
        }

        @keyframes bounceIn {
            0% {
                transform: scale(0);
                opacity: 0;
            }
            50% {
                transform: scale(1.1);
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        h1 {
            font-size: 28px;
            margin-bottom: 10px;
            color: #333;
            animation: fadeIn 0.5s ease forwards;
        }

        p {
            font-size: 20px;
            margin: 15px 0;
            color: #555;
            animation: fadeIn 0.5s ease forwards;
            animation-delay: 0.2s;
        }

        strong {
            color: #FF4B2B;
            font-size: 24px;
        }

        a {
            text-decoration: none;
            color: #ffffff;
            background-color: #FF4B2B;
            padding: 10px 20px;
            border-radius: 5px;
            font-weight: bold;
            margin-top: 20px;
            display: inline-block;
            transition: background-color 0.3s, transform 0.3s;
            position: relative;
            overflow: hidden;
            animation: fadeIn 0.5s ease forwards;
            animation-delay: 0.4s;
        }

        a:hover {
            background-color: #ff6f61;
            transform: scale(1.05);
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .footer {
            position: absolute;
            bottom: 20px;
            font-size: 14px;
            color: #333;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="loading" id="loading"></div>
    <div class="result-container" id="result-container" role="alert" aria-live="polite">
        <h1><i class="fas fa-tint" style="color: #FF4B2B;"></i> Blood Group Prediction</h1> <!-- Blood drop icon -->
        <p>Your predicted blood group is: <strong>{{ blood_group }}</strong></p>
        <a href="{{ url_for('upload') }}"><i class="fas fa-upload"></i> Upload Another Fingerprint</a>
    </div>

    <div class="footer">
        © 2024 Blood Group Detection System. All Rights Reserved.
    </div>

    <script>
        // Show loading animation and hide result after a delay
        window.onload = function() {
            // Start with loading animation
            document.getElementById('loading').style.display = 'block';
            
            // Simulate loading delay
            setTimeout(function() {
                // Hide loading and show result
                document.getElementById('loading').style.display = 'none';
                const resultContainer = document.getElementById('result-container');
                resultContainer.style.display = 'block';
                resultContainer.classList.add('show'); // Add the show class for animation
            }, 1500); // 1.5 seconds delay
        };
    </script>
</body>
</html>
